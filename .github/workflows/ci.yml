name: Verify ProcureDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procuredesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procuredesk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/procuredesk_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/procuredesk_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate:postgres
      - run: npm run test:postgres
      - run: npm run build

